name: CD - Docker Hub

# Disabled automatic Docker Hub push triggers
# To re-enable automatic deployments on git push, uncomment the push trigger below:
# on:
#   push:
#     branches: ["master"]

on:
  workflow_dispatch: # Disabled automatic push. Manual trigger only.

jobs:
  build-and-push:
    if: false # Disabled job execution
    runs-on: ubuntu-latest
    steps:
      ## Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      ## Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      ## Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      ## Build & Push Orders Service
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/orders-service
          file: ./apps/orders-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/orders-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/orders-service:${{ github.sha }}

      ## Build & Push Products Service
      - name: Build and push Products service
        uses: docker/build-push-action@v4
        with:
          context: ./apps/products-service
          file: ./apps/products-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/products-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/products-service:${{ github.sha }}

      ## Build & Push API Gateway Service
      - name: Build and push API Gateway service
        uses: docker/build-push-action@v4
        with:
          context: ./apps/api-gateway
          file: ./apps/api-gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:${{ github.sha }}
