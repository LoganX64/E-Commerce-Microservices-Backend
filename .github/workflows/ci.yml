name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout repo
        uses: actions/checkout@v4

      - name: ⚡ Enable Turbo Remote Cache
        uses: dtinth/setup-github-actions-caching-for-turbo@v1

      - name: 🟨 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install deps
        run: npm install

      - name: 🧹 Lint (allow warnings)
        run: npx turbo run lint -- --max-warnings=10

      - name: 🧪 Test
        run: npx turbo run test

      - name: 🏗️ Build
        run: npx turbo run build
